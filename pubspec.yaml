name: autopanel
description: Tablero inteligente para el auto (OBD2, GPS, clima, gasolina, recordatorios).
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: '>=13.0.0 <16.0.0'
  http: '>=1.2.0 <2.0.0'
  shared_preferences: '>=2.2.0 <3.0.0'
  flutter_map: '>=7.0.0 <9.0.0'
  latlong2: '>=0.9.0 <0.10.0'

flutter:
  uses-material-design: true
